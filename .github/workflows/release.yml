name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The default token is read-only; creating a release needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-static-${{ runner.os }}

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg install openssl:x64-windows-static
          vcpkg integrate install

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare release artifacts
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build\Release\soi-share.exe dist\
          Copy-Item build\Release\viewer.html   dist\
          Compress-Archive -Path dist\* -DestinationPath soi-share-${{ github.ref_name }}-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SOI ${{ github.ref_name }}"
          body: |
            ## SOI — Serverless P2P Screen Share ${{ github.ref_name }}

            Download `soi-share.exe`. That single file is all you need: no installer, no
            runtime, no admin rights. Windows 10 2004 or later.

            ```powershell
            .\soi-share.exe start      # runs in the background, prints a 6-character code
            .\soi-share.exe status     # from any terminal
            .\soi-share.exe stop       # from any terminal
            ```

            Or just double-click `soi-share.exe`: it starts sharing and shows the code.

            Your friend opens https://share.mdarif.online and types the code. It works
            from any network. The zip also contains `viewer.html` for the offline
            `--no-code` flow.

            First run: the exe is unsigned, so SmartScreen may say "Windows protected
            your PC" — click **More info → Run anyway**. Allow the firewall prompt on
            Private networks.

            Install to PATH, updating, uninstalling and troubleshooting:
            [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)
          files: |
            dist/soi-share.exe
            soi-share-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: false
